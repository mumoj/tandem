[project]
name = "tandem"
version = "0.1.0"
description = "Supervise a headless OpenCode implementer for a frontier-model planner"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jack Mumo" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "mcp>=1.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
tandem = "tandem.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tandem"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # modern syntax
    "B",             # likely bugs
    "SIM",           # simpler forms
    "C4",            # comprehensions
    "RUF",           # ruff's own checks
    "ASYNC",         # blocking calls inside async code
    "PTH",           # pathlib over os.path
    "PT",            # pytest style
    "N",             # naming
]

[tool.ruff.lint.per-file-ignores]
# Typer reads option metadata from default values, which is exactly what B008 flags.
"src/tandem/cli/*.py" = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Tests poke at private state on purpose and lean on fixtures pyright cannot see through.
executionEnvironments = [
    { root = "tests", extraPaths = [".", "src"], reportPrivateUsage = false, reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportMissingParameterType = false, reportUnknownParameterType = false, reportUnknownLambdaType = false },
    { root = "src" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: drives a real `opencode serve` with a scripted model (needs OpenCode 1.x)",
]
addopts = "-ra"
